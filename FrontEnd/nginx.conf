events {
  worker_connections 1024;
}


http {

  # IPs públicos da Cloudflare (atualizados pela própria Cloudflare)
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/12;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;

    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;



    server {
        listen 8888;
        server_name _;

        location / {
            default_type text/plain;
            return 200 "$remote_addr\n";
        }
    }

  ##########################################
  # HTTP para ioe.presserv.org
  ##########################################
  server {
    listen 80;
    server_name ioe.presserv.org;

    location / {
        proxy_pass http://frontend1:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }

  ##########################################
  # HTTP para api.presserv.org
  ##########################################
  server {
    listen 80;
    server_name api.presserv.org;

  # --- VALIDAR LICENÇA ---
    location ~ ^/api/validar-licenca/[^/]+$ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        allow all;
    }

    # --- KEEPALIVE ---
    location ~ ^/api/keepalive/[^/]+$ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        allow all;
    }

    # --- API RESTRITA ---
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Libera toda a faixa da bridge
        allow 172.18.0.0/16;   # <- Libera toda a rede bridge
       # allow 127.0.0.1;       # <- localhost IPv4
       # allow ::1;             # <- localhost IPv6
        allow 66.131.127.113;
        allow 179.111.233.156;
        deny all;              # <- bloqueia todo o resto!
        }
  }

  ##########################################
  # HTTP para internal.presserv.org
  ##########################################
  server {
    listen 80;
    server_name internal.presserv.org;

    location / {
        proxy_pass http://frontend2:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        allow 172.18.0.0/16;   # <- Libera toda a rede bridge
        allow 66.131.127.113;
        allow 179.111.233.156;
        deny all;              # <- bloqueia todo o resto!
    }
  }

  ##########################################
  # HTTPS para ioe.presserv.org
  ##########################################
  server {
    listen 443 ssl;
    server_name ioe.presserv.org;

    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    location / {
        proxy_pass http://frontend1:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }

  ##########################################
  # HTTPS para api.presserv.org
  ##########################################
  server {
    listen 443 ssl;
    server_name api.presserv.org;

    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;


  # --- VALIDAR LICENÇA ---
    location ~ ^/api/validar-licenca/[^/]+$ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        allow all;
    }

    # --- KEEPALIVE ---
    location ~ ^/api/keepalive/[^/]+$ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        allow all;
    }

    # --- API RESTRITA ---
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Libera toda a faixa da bridge
        allow 172.18.0.0/16;   # <- Libera toda a rede bridge
       # allow 127.0.0.1;       # <- localhost IPv4
       # allow ::1;             # <- localhost IPv6
        allow 66.131.127.113;
        allow 179.111.233.156;
        deny all;              # <- bloqueia todo o resto!
        }
  }

  ##########################################
  # HTTPS para internal.presserv.org
  ##########################################
  server {
    listen 443 ssl;
    server_name internal.presserv.org;

    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    location / {
        proxy_pass http://frontend2:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        allow 172.18.0.0/16;   # <- Libera toda a rede bridge
        allow 66.131.127.113;
        allow 179.111.233.156;
        deny all;              # <- bloqueia todo o resto!
        }
    }
  }
