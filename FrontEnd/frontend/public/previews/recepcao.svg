<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 180" fill="none">
  <!-- fundo -->
  <rect width="280" height="180" rx="12" fill="#ecfdf5"/>

  <!-- painel esquerdo: busca contrato -->
  <rect x="12" y="12" width="118" height="156" rx="8" fill="white" stroke="#a7f3d0" stroke-width="1"/>

  <!-- título painel -->
  <rect x="20" y="20" width="60" height="6" rx="3" fill="#10b981"/>
  <rect x="20" y="30" width="90" height="6" rx="3" fill="#d1fae5"/>

  <!-- campo busca -->
  <rect x="20" y="44" width="100" height="14" rx="5" fill="#f0fdf4" stroke="#a7f3d0" stroke-width="1"/>
  <rect x="26" y="49" width="60" height="4" rx="2" fill="#d1fae5"/>

  <!-- resultado contrato -->
  <rect x="20" y="66" width="100" height="48" rx="6" fill="#f0fdf4" stroke="#a7f3d0" stroke-width="1"/>
  <rect x="26" y="72" width="40" height="4" rx="2" fill="#6ee7b7"/>
  <rect x="26" y="80" width="70" height="5" rx="2.5" fill="#34d399"/>
  <rect x="26" y="89" width="55" height="4" rx="2" fill="#a7f3d0"/>
  <rect x="26" y="97" width="45" height="4" rx="2" fill="#a7f3d0"/>

  <!-- botão selecionar -->
  <rect x="20" y="120" width="100" height="14" rx="5" fill="#10b981"/>
  <rect x="44" y="124" width="52" height="6" rx="3" fill="white"/>

  <!-- painel direito: recebimento -->
  <rect x="140" y="12" width="128" height="156" rx="8" fill="white" stroke="#a7f3d0" stroke-width="1"/>

  <!-- título -->
  <rect x="150" y="20" width="55" height="6" rx="3" fill="#10b981"/>

  <!-- símbolo monetário grande -->
  <circle cx="204" cy="65" r="24" fill="#f0fdf4" stroke="#a7f3d0" stroke-width="1.5"/>
  <!-- R$ simplificado -->
  <text x="193" y="73" font-family="Arial" font-size="20" font-weight="bold" fill="#10b981">R$</text>

  <!-- valor digitado -->
  <rect x="150" y="98" width="108" height="16" rx="5" fill="#f0fdf4" stroke="#34d399" stroke-width="1.5"/>
  <rect x="156" y="104" width="72" height="5" rx="2.5" fill="#34d399"/>

  <!-- data / referência -->
  <rect x="150" y="120" width="50" height="10" rx="4" fill="#f0fdf4" stroke="#a7f3d0" stroke-width="1"/>
  <rect x="154" y="124" width="34" height="3" rx="1.5" fill="#a7f3d0"/>
  <rect x="208" y="120" width="50" height="10" rx="4" fill="#f0fdf4" stroke="#a7f3d0" stroke-width="1"/>
  <rect x="212" y="124" width="34" height="3" rx="1.5" fill="#a7f3d0"/>

  <!-- botão receber -->
  <rect x="150" y="138" width="108" height="20" rx="7" fill="#10b981"/>
  <rect x="172" y="145" width="64" height="6" rx="3" fill="white"/>
</svg>
